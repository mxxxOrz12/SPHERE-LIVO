    Rcl: [-0.9999243215275557, 0.01198521423408928, -0.0027759426184009693,
          0.0028024268194068447, 0.002193510766066442, -0.9999936674371699,
          -0.011979049276947663, -0.9999257688200072, -0.002226932450328567]
    Pcl: [0.00003388762063794015, -0.07994358595369325, -0.05600121569499821]
    cam_model: EquidistantCamera
    cam_width: 1440
    cam_height: 1080
    scale: 0.5
    cam_fx: 697.4908124760002
    cam_fy: 696.9171455329763
    cam_cx: 719.1718975625936
    cam_cy: 543.7401536075661
    k1: -0.04417827343575797
    k2: 0.006234275291082348
    k3: -0.0028153029005502637
    k4: -0.0005652124301059104
