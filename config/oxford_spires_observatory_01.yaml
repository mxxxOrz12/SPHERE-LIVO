    cam_model: EquidistantCamera
    cam_width: 1440
    cam_height: 1080
    scale: 0.5
    cam_fx: 698.4588137038655
    cam_fy: 699.3937128891818
    cam_cx: 708.6474762128631
    cam_cy: 533.7390355049014
