# Oxford Spires 2024-03-13-observatory-quarter-01, ROS 1 raw bag.
# Camera parameters and LiDAR/camera/IMU transforms come from the dataset's
# configs/sensor.yaml (OPENCV_FISHEYE). Rcl/Pcl map LiDAR coordinates to camera.
# extrinsic_R/T below map LiDAR coordinates to IMU, derived from the two
# cam_front transforms in that same calibration file.
common:
  lid_topic: /hesai/pandar
  imu_topic: /alphasense_driver_ros/imu
  img_en: 1
  lidar_en: 1

multi_fisheye:
  enabled: true
  camera_count: 3
  compressed_images: true
  sync_tolerance: 0.005
  frame_stride: 2  # 20 Hz camera rig -> at most 10 Hz visual updates
  cam0:
    img_topic: /alphasense_driver_ros/cam0/debayered/image/compressed
    Rcl: [0.00976944336946739, 0.9999460020163567, 0.003542742970500279,
          0.007671197638838501, 0.00346786135188204, -0.999964562704314,
          -0.9999228523756404, 0.0097962742483243, -0.007636904334543448]
    Pcl: [0.00035060884033447846, -0.079574053851818, -0.053826061545697405]
    cam_model: EquidistantCamera
    cam_width: 1440
    cam_height: 1080
    scale: 0.5
    cam_fx: 698.1692094914263
    cam_fy: 698.5147584873237
    cam_cx: 712.7646767255006
    cam_cy: 560.5751284820508
    k1: -0.04114225009462773
    k2: -0.002421765984053725
    k3: 0.003400355152679783
    k4: -0.0018518822347983275
  cam1:
