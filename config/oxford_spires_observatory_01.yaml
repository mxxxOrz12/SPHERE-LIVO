innovations:
  spherical_patch: false  # baseline; set true via launch arg for the new method
  shared_spherical_map: true
  information_selection: true
  joint_fixed_budget: true
  spherical_affine: true  # ablation: false keeps absolute patch intensity
  spherical_min_zncc: 0.8  # Oxford full-bag validated; reject stale/mismatched patches
  max_active_cameras: 2
  total_patch_budget: 120
  map_insert_budget_per_camera: 30
  spherical_probe_budget: 2048
  joint_max_iterations: 3
  spherical_map_max_points: 60000

extrin_calib:
  extrinsic_T: [-0.000651708683372088, -0.015510342560109035, 0.08463265780318904]
  extrinsic_R: [-0.016638045748656113, -0.9998601056363506, 0.0017159809243348018,
                 0.999855257258116, -0.016631813594098235, 0.0035843144224125944,
                 -0.003555273122162113, 0.0017753685358884396, 0.9999921040186213]

time_offset:
  img_time_offset: 0.0
  imu_time_offset: 0.0
  lidar_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  lidar_type: 5  # XT32 parser also matches this bag's QT64 x/y/z/intensity/timestamp/ring layout
  scan_line: 64
  point_filter_num: 1
  feature_extract_enabled: false  # XT32 feature path assumes a different timestamp unit
  hilti_en: false
  blind: 1.0
  filter_size_surf: 0.2

vio:
  max_iterations: 5
  outlier_threshold: 78
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: false

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.1
  gyr_cov: 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0001
  voxel_size: 0.4
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1

evo:
  seq_name: oxford_observatory_01
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  colmap_output_en: false

image_save:
  img_save_en: false
